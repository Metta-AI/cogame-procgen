# ONE service, because the manifest image placeholder is derived from the
# compose service name by uppercasing and mapping "-" to "_"
# ({{PROCGEN_IMAGE}}). {{GAME_IMAGE}} is not a thing (lantern 0.1.0).
#
# ONE image, TWO entrypoints: /bin/procgen (the game server, which makes every
# LLM call) and /bin/procgen-player (the thin seat registrar). The whole policy
# set is env-switched inside this same image (PLAYER_PROMPT vs
# PLAYER_SCRIPTED), which is what keeps a champion and a scripted filler
# byte-identical apart from their environment.
services:
  procgen:
    image: coworld-procgen:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      network: host

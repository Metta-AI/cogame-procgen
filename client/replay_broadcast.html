@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft: rgba(20, 14, 9, 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --green: #45a85e;
  --yellow: #ddc531;
  --amber: #e8a33d;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
  /* One-finger drags belong to the PAGE while the board is fitted; syncTouchAction
     takes them back (touch-action: none) once there is somewhere to pan. Neither
     value permits pinch-zoom, so the second finger always reaches our handler
     instead of zooming the document. */
  touch-action: pan-x pan-y;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* Team color utility: any chrome element carrying a team-name class exposes
   that team's tint as --tc, and every team-colored rule below reads
   var(--tc, <neutral fallback>). Supporting a new team = one line here plus
   its art — no per-team selector pairs anywhere else. */
.red { --tc: var(--red); }
.blue { --tc: var(--blue); }
.green { --tc: var(--green); }
.yellow { --tc: var(--yellow); }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — the top rows of the board stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}

/* One side of the scorebug: one plate per side for classic red/blue (exactly
   the old layout); a 3-4 team game puts BOTH of a side's plates on the same
   row (outer team at the screen edge, inner team beside the clock), so all
   four teams read on one line across the band. */
.plates {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(5 * var(--u));
  min-width: 0;
}
.plates.row { flex-direction: row; align-items: center; gap: calc(18 * var(--u)); }
.plates.row .plate { flex: 1 1 0; }
.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
/* Orientation is a SIDE property, not a color property: right-side plates
   mirror so both team names stay innermost, flanking the clock. */
.plate.side-r { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with the length numeral on ONE row. Let the name shrink and
     ellipsis so a long policy name never pushes the numeral off the plate; the
     label and numeral hold their size.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate .team-name { color: var(--tc, var(--paper)); }

/* One baseline row with the seat name innermost (toward the center clock), so
   names flank the clock. Left reverses; right keeps DOM order. */
.plate .lives-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.side-l .lives-line { flex-direction: row-reverse; }
.plate .perk-ico { display: inline-flex; }
.plate .perk-ico svg {
  width: calc(10 * var(--u));
  height: calc(10 * var(--u));
  display: block;
}

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(26 * var(--u)); /* reserved slot: layout never jumps */
}
.banner-chip {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(6 * var(--u)) calc(14 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  border-bottom: calc(3 * var(--u)) solid var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
  animation: chippop 300ms cubic-bezier(.2,1.4,.4,1);
}
.banner-chip.steal { border-bottom-color: var(--amber); }
.banner-chip.returned { border-bottom-color: var(--paper-dim); }
.banner-chip.wipe { border-bottom-color: var(--tc, var(--red)); font-size: calc(15 * var(--u)); }
/* the acting team's tint rides as a left accent bar (any team color) */
.banner-chip.accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--tc, var(--amber)); }
.banner-chip.leaving { animation: chipfade 260ms ease-in forwards; }
@keyframes chippop { from { transform: translateY(calc(-8 * var(--u))) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes chipfade { to { opacity: 0; transform: translateY(calc(-4 * var(--u))); } }

/* ---------- 2. KILL FEED ---------- */
#killfeed {
  position: absolute;
  /* Bottom-right, clear of the blue scorebug/roster (top) and the transport
     bar (bottom). column-reverse so the newest row sits lowest, nearest the
     transport, and older kills stack upward — a broadcast lower-third feed. */
  bottom: calc(76 * var(--u));
  right: calc(12 * var(--u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(4 * var(--u));
  align-items: flex-end;
  width: calc(228 * var(--u));
  min-height: calc(4 * 22 * var(--u)); /* fixed 4-row reserve */
  z-index: 11;
  /* Rows are display-only (no click handlers) — never let the feed intercept a
     drag meant for the PiP or the board beneath it. */
  pointer-events: none;
}
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #killfeed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who { color: var(--tc, var(--paper)); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline momentum graph.
   The seek track and the momentum graph share the SAME 0→maxTicks x-axis, so
   the playhead crosses the graph 1:1 with the timeline (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the momentum curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* Full-timeline lives-lead graph, occupying the band UNDER the seek track. */
.momentum {
  position: absolute;
  /* An inline <svg> is a REPLACED element: with width:auto it takes its
     intrinsic viewBox ratio (1000×100 = 10:1) × height, NOT the left/right
     box — so it renders ~10× its height wide (a short stub) instead of full
     width. Pin width:100% so it spans the whole seek track, matching the
     0→maxTicks x-axis the playhead rides. (preserveAspectRatio:none, so no
     letterboxing when we override the ratio.) */
  left: 0; width: 100%; top: calc(12 * var(--u));
  height: calc(22 * var(--u));
  display: block;
  overflow: visible;
}
.momentum-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
/* winner cap: a flat block just past the track's right end, colored by the
   verdict (split for a draw), so the scrubber itself says how this ends. */
.scrub-win {
  display: none;
  position: absolute;
  right: calc(-4 * var(--u));
  top: calc(2 * var(--u));
  width: calc(6 * var(--u));
  height: calc(12 * var(--u));
  z-index: 3;
}
.scrub-win.show { display: block; background: var(--tc, var(--paper-dim)); }
/* verdict chip in the transport bar: "RED WINS" next to the tick clock. */
.win-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.win-chip.show { display: inline; }
.win-chip.show { color: var(--tc, var(--paper-dim)); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(242, 232, 216, 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(242, 232, 216, 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* hash-mismatch warning (top center) — honest fidelity flag */
#mmwarn {
  position: absolute;
  top: calc(40 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--red);
  color: var(--paper);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  z-index: 20;
}
#mmwarn.on { display: block; }

/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  /* Cover the BOARD region only — never the scorebug or transport bands. The
     transport must stay clickable under the end card so the scrubber can jump
     back into the match from the score screen (the card cancels server-side
     end-hold on seek). --topband/--band are the measured band heights that
     relayout() maintains on :root; in embed mode both are 0 and the card
     spans the whole iframe as before. */
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  bottom: var(--band, 0px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: cardfade 420ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
#endcard .headline { color: var(--tc, var(--ghost)); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* match-stats scoreboard — one panel per team, winner ringed in amber.
   Wraps + centers so a 3rd/4th team panel folds to a second row. */
#endcard .ec-teams {
  display: flex;
  gap: calc(22 * var(--u));
  align-items: stretch;
  flex-wrap: wrap;
  justify-content: center;
}
#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(20, 14, 9, 0.55);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}
#endcard .ec-team.win {
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.65),
    0 0 calc(14 * var(--u)) rgba(232, 163, 61, 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname { color: var(--tc, var(--paper)); }
#endcard .ec-lives { display: flex; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); }
#endcard .fl-num { font-size: calc(22 * var(--u)); color: var(--tc, var(--paper)); }
/* mixed-team policy subheader: groups a team panel's rows by policy when a
   team seats more than one (CTF-Doubles: two policies per side) */
#endcard .ec-pol {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-top: calc(3 * var(--u));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .fl-cap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
#endcard .ec-thead,
#endcard .ec-row {
  display: grid;
  grid-template-columns: 1fr calc(22 * var(--u)) calc(22 * var(--u)) calc(26 * var(--u)) calc(26 * var(--u));
  gap: calc(5 * var(--u));
  align-items: center;
}
#endcard .ec-thead {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  border-bottom: 1px solid rgba(242, 232, 216, 0.18);
  padding-bottom: calc(3 * var(--u));
}
#endcard .ec-thead span:not(:first-child) { text-align: center; }
#endcard .ec-row {
  font-family: var(--pixfont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  padding: calc(1.5 * var(--u)) 0;
}
#endcard .ec-row .n { text-align: center; font-variant-numeric: tabular-nums; }
/* the endcard's numeric cells are centred and tabular so the four rows read as
   a table rather than as four sentences */
#endcard .ec-row .n.cap {
  color: var(--amber);
  display: flex;
  justify-content: center;
  align-items: center;
}
#endcard .ec-row .n.cap > * + * { margin-left: calc(-7 * var(--u)); }
#endcard .ec-row .pname {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper-dim);
}
#endcard .ec-row.mvp .pname { color: var(--amber); }
/* name cell: name ellipsizes (but keeps a readable floor), the capture mark
   + honor badges ride after it; a pathological pileup clips inside the cell
   rather than bleeding into the K column */
#endcard .ec-row .pcell {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  min-width: 0;
  overflow: hidden;
}
#endcard .ec-row .pcell .pname { flex: 0 1 auto; min-width: 7ch; }
/* honor badges: baked 2x pixel-art icons (nano-banana), luminance-keyed to
   transparency; a repeat count rides after the icon as fine print */
#endcard .ec-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: calc(1 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .ec-badge::before {
  content: '';
  display: block;
  height: calc(14 * var(--u));
  background-size: contain;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}
#endcard .ec-badge.bs::before { width: calc(10.5 * var(--u)); background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABUAAAAcCAYAAACOGPReAAAFD0lEQVR42qWWX2wc1RXGf2dmZ2d3/TfO2qzjOEkdOxGhEJGIFhIodVqME2goBAfVRFUFUlS1D62qVv2jisXiCb9VraiIxEOlthKOKrV9AARSTR8qEAIKliCghpAG0drGya4d7+7s3N39+rBZY7VNGujVHc2VRufTOd/5znfH+JRLYAbSHffeT6Z8N/uvu56lxDGbnj7l8X8s5fMe9UYNmUddORYW9gDYpwITZob02NggFg7wUqLC+cWbKV/8tc3NlbyrKVMTE74uJbD2fnxfB6IHnwwHqwv28l+etLm5EsD/BDWQnTxZN1AL0AyxEvbgeyN4Jj7yVpTHa31PXL5EmZlJE4dypL1jtHU+Zb/8bUFgyo/1EHp9JJJFSvFrNvVcudW4K2f66KNNvtusA8e1/L10nw4d2moghr0aXjCIGhds6rkV5fFagJ+oURo/ciPEN9DQKjn7G/1Lvj3+0l/XZ3jVoAIjnzdef30rVYZR6jT9lZ9y4NZnef/Mi9B/AaawKRqfCNRAOjI+zUW/Sh9vUV9N8/Vjt/DMC/P285lH/j3mit3XxIRvID0w/iVqFoK3CrXvc8/YD7lp+zKL1T/p8OEf6NjBb68Nw5VA1/T44Hgnjpup+RU2RHsZ7G1n3x6PSu139vQfXiT038X8wvrYxHoJNTVoTdLzebOpqbqOju/EedtI+kt4tW184fP9pMJp6zvwsjSbMBv94zoJNi7L6RqPk3cNUeY41WCZztX9bLtmJw9N+OzYvxuyq2Ctrf/gVJIvaXukaIfOnUsDpttvT1Cr30VVISz3sbE9xzeODNPd8YRZ78VmUQgpKWm4UqkMS/IBEpcO28ANhM6DbLYKnCOXGaIY76C3d5lsx2GGNneT7TlDsfC0lP+4F2V6yZBLpVItGs8mgF0OlwFqQRDA2bPzBpJjjIgVfvTQKBszwySVprTyiI3c+4E0mwDqAGT4J7gBCDznXE8QBGnPOdeFI8RRda7sopGRAX153yZkuzDVeeH5LnLb03QN/J5i8RfNho7WzUySPGCXc3hAFASEzrnORBwHp9uCuG/+1Kn3crWa9MYrQ2Q6HyayC/R5tzHQ00vhLDSSP7EbHixIk00vLZU2Ab04OoMgeBOI4zjY4RyLifZ2m9fs7FL/6GgNQPeMPUA5WSUo55g8+FnGvpitz5/P+++8e0avvhrEcXytpLRzTgEsEXAKqJtZXdJbYWj1psAn8O0kdX3t7lv4KLqfRhW+c98kd96W48N/fO/80Fee2kjUR9WShKErU65kyMybWW1VyrXBAPC2mVUkmWlmxrejR+sandyKv/gtBjK7OXrHXu68NcuHhcfYMjpNFGWdr61BkK4TUyTJe8sspzIuMxQQBGXHB5kMC5cybk6RDuz9HJb6JuM37eHhr+7GD//Mavk3bDrwK4gGIRUTx72YpQmCxUqlEqfTaQE+sAqsmFl1zaX0xI8nGew/QXZDG1typ+lof4fG0Hfp6jsDJAFXonRNG8nPAH6VxlJIeBpoNIePLUDFzBZat4Xp/ed/Rld7mnT7HKnrn+TECTh+fAuustlBHRI0gsaFMLYkyaQAhyNDQMo5Z1JQSiZ5ozX3V7iCFRSLxQ2SuiR1lMvlQUmDhUKhO4q0U1K7pK4o0s5CodD9XwBmfM3OJqQZX8Kkj01GUqokba6qeqOkNECkaCSKol2FQqG75WxX+bMgu/Rsqkq7JYXr7bFS0VBVuu5y8f8CyPZwOPj4umUAAAAASUVORK5CYII="); }
#endcard .ec-row .n.clstr { color: var(--amber); }
/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   PRE-LOAD CURTAIN — THE GENERATOR ROOM
   The wasm/replay boot can take seconds; instead of a dark board
   captioned "Warming up", the stage opens on the backstage room
   UNDER the arena: the four cogs coiling up before the round.
   The scene is nanobanana-generated
   art (art/lockerroom/ — same warm Ink & Print world as the
   dungeon wall textures): ONE static empty-room plate (bg.jpg)
   with five alpha-sprite poses per cog (<bot>_<pose>.webp)
   layered on top and cycled per bot (see .lk-art below).
   Dismissed by the first ingested frame (dismissLockerRoom).
   Sits UNDER #status (fine-print
   connection state stays readable) and #mmwarn; shown in embed
   mode too — it IS the League Replayer's lit floor while loading.
   ============================================================ */
#lockerroom {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow: hidden;
  font-family: var(--pixfont);
  background: radial-gradient(120% 95% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 55%, #100b07 100%);
  opacity: 1;
  transition: opacity 600ms ease;
}
#lockerroom.gone { opacity: 0; pointer-events: none; }

/* hanging-lamp light: an amber pool over the room + a low bounce off the
   floor, with the occasional basement-fixture flicker */
#lockerroom .lk-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 60% at 50% 28%, rgba(232, 163, 61, 0.15), transparent 70%),
    radial-gradient(62% 26% at 50% 88%, rgba(232, 163, 61, 0.08), transparent 75%);
  animation: lk-flicker 9s linear infinite;
}
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}

/* The scene: ONE static background plate (bg.jpg — the empty room) with
   the four cogs layered on top as freestanding alpha sprites, five
   generated poses each. Every bot runs its own pose carousel (distinct
   cycle length + phase, crossfaded windows) over its own idle sway, so
   the composed scene never repeats for minutes — smooth continuous
   animation over a rock-solid background. A soft radial mask melts the
   plate's edges into the stage gradient, and the whole scene breathes
   on a slow zoom. */
#lockerroom .lk-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: lk-breathe 14s ease-in-out infinite alternate;
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
#lockerroom .lk-bg {
  display: block;
  max-width: 94%;
  max-height: 96%;
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
}
/* sprite plane, fitted to the bg image's box by fitLockerSprites() */
#lockerroom .lk-sprites { position: absolute; }
/* one wrapper per bot (anchored over its floor spot, carries the idle
   sway), its pose sprites stacked bottom-center inside */
#lockerroom .lk-boto { position: absolute; transform-origin: 50% 100%; }
#lockerroom .lk-boto img {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  opacity: 0;
  animation: lk-pose var(--cyc, 4s) linear infinite;
}
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
#lockerroom .lk-boto:nth-child(1) { animation: lk-sway 3.4s ease-in-out infinite; }
#lockerroom .lk-boto:nth-child(2) { animation: lk-sway 2.9s ease-in-out -1.2s infinite; }
#lockerroom .lk-boto:nth-child(3) { animation: lk-sway 3.8s ease-in-out -0.6s infinite; }
#lockerroom .lk-boto:nth-child(4) { animation: lk-sway 3.1s ease-in-out -2s infinite; }

/* rotating prep-talk line + amber scan bar + fine print, over the floor */
#lockerroom .lk-cap {
  position: absolute;
  bottom: 13%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.8), 0 0 calc(8 * var(--u)) rgba(10, 7, 4, 0.9);
  transition: opacity 150ms;
}
#lockerroom .lk-cap.swap { opacity: 0; }
#lockerroom .lk-bar {
  position: absolute;
  bottom: 10.2%;
  left: 50%;
  transform: translateX(-50%);
  width: calc(150 * var(--u));
  height: calc(3 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: calc(2 * var(--u));
  overflow: hidden;
}
#lockerroom .lk-bar i {
  position: absolute;
  top: 0; bottom: 0;
  left: -34%;
  width: 34%;
  border-radius: calc(2 * var(--u));
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: lk-scan 1.6s ease-in-out infinite alternate;
}
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#lockerroom .lk-sub {
  position: absolute;
  bottom: 6.4%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ghost);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.9);
}

@media (prefers-reduced-motion: reduce) {
  #lockerroom * { animation: none !important; }
  /* with the carousels stopped, hold each bot's rest pose over the plate */
  #lockerroom .lk-boto img:first-child { opacity: 1; }
}

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + headers + standings + transport, drawn from the
   postMessage frame stream. Here we show the board (the lit pit floor) PLUS
   the designed broadcast feedback layer that belongs over the play area —
   the match feed and the banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <!-- Pre-load curtain: the bot locker room. The six art frames (srcs set by
       buildLockerRoom — the path prefix is delivery-mode dependent) play as a
       ~4fps idle loop; the whole scene fades out on the first ingested
       frame (dismissLockerRoom). role=status so screen readers hear one
       "Loading replay" while the visual squad preps their markers. -->
  <div id="lockerroom" role="status" aria-label="Loading replay">
    <div class="lk-art" id="lk-art" aria-hidden="true">
      <img class="lk-bg" id="lk-bg" alt="">
      <div class="lk-sprites" id="lk-sprites"></div>
    </div>
    <div class="lk-glow" aria-hidden="true"></div>
    <div class="lk-cap" id="lk-cap" aria-hidden="true">Generating levels&hellip;</div>
    <div class="lk-bar" aria-hidden="true"><i></i></div>
    <div class="lk-sub">Generator room &middot; Loading replay</div>
  </div>

  <div id="chrome">
    <!-- Plates are generated per seat by the appended game block's
         renderPlates(): ONE plate, in #plates-l — there is one seat.
         Each plate holds a colour chip, the seat's REAL policy name (spectator
         side only), its in-game alias, its length as a big numeral, a health
         bar when the module has health, a place badge once it is out, and a
         fallback glyph on any seat that has taken one. -->
    <div id="scorebug">
      <div class="plates" id="plates-l"></div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">▸▸</span>
          <div class="caption" id="clock-caption">Before the first level</div>
        </div>
      </div>

      <!-- #plates-r and the second plate column are REMOVED: there is one
           seat, so #plates-l carries the single plate and the space it
           frees goes to the clock and the split readout. -->
    </div>

    

    <div id="mmwarn">Replay hash mismatch — showing recorded moves</div>
    
    
    <div id="bannerlane"></div>
    <!-- class="feed" is not styling: tools/ci/viewer_smoke.mjs (the shared
         template, copied verbatim, never edited per repo) reads the match
         feed through `document.querySelector("#feed, .feed, #log")`. This
         game inherited the starter's `#killfeed` id, which matches none of
         those, so `feed_lines` in viewer-smoke.json was 0 on every run
         whether or not a single row had been drawn -- a number that covered
         nothing. The class makes it real evidence. No CSS rule selects
         `.feed`; the rows are `.feed-row`. -->
    <div id="killfeed" class="feed"></div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">⟲</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">◂|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">▶</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|▸</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">↻</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">▸▸</button>
        <button class="tbtn" id="btn-spoilers" title="Spoilers: deaths / level results / final score on the timeline ahead of the playhead (o)">spoilers</button>
        <span class="ffwd-chip" id="ffwd-chip">▸▸ SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- momentum graph sits UNDERNEATH the seek track, on the SAME tick/mx
             axis, so the playhead crosses it 1:1 with the timeline -->
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">SEEN vs UNSEEN</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">—</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <!-- One stats panel per active team, generated by ensureEndcardTeams(). -->
      <div class="ec-teams" id="ec-teams"></div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- WIRE_CONSTANTS -->
<!-- CHROME_COMMON -->
<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // Shared replay chrome (chrome_common.js, spliced over the CHROME_COMMON
  // marker by the server / dist bundle; the literal marker must not appear
  // inside this script or the splice would corrupt it). A raw file:// open of
  // this source has no splice — same non-functional baseline as the missing
  // BROADCAST_CORE — so fail loud and early instead of throwing mid-file.
  if (!window.ChromeCommon) {
    console.error('replay_broadcast: chrome_common.js missing — this page must be served spliced (native server or dist bundle), not opened raw.');
    return;
  }
  var C = window.ChromeCommon({
    send: function (cmd) { send(cmd); },
    sendPov: function (slot) { send('v:' + slot); },
    getState: function () { return lastState; }
  });
  // Aliases so the per-view code below reads exactly as before. The starter's
  // TEAM machinery (RED/BLUE/GREEN/YELLOW, teamCol, activeTeams, teamOf,
  // teamName, teamPolicies, teamHeadline, killMarkerTeam, captureTeam,
  // setVerdict, togglePov, setHandicap, teamPerkGroups, perkIconsHtml) is
  // dropped with the mechanics it drove: a four-way free-for-all has no sides.
  // markBeat stays aliased on purpose -- the appended block's builder is
  // deliberately named procgenBeat so it can never shadow it.
  var esc = C.esc, fmt = C.fmt, setName = C.setName;
  var renderClock = C.renderClock, renderTransport = C.renderTransport;
  var ingestLullSpans = C.ingestLullSpans, renderLullSpans = C.renderLullSpans;
  var markBeat = C.markBeat, renderBeatMarkers = C.renderBeatMarkers;
  var ingestLeadSeries = C.ingestLeadSeries, renderMomentum = C.renderMomentum;
  var getSpoilers = C.getSpoilers, setSpoilers = C.setSpoilers;
  // ---- delivery-mode asset base --------------------------------------------
  // This page is served from THREE places and a leading slash is only correct
  // at one of them: the native server bare (/client/replay), the native server
  // proxied (/<prefix>/client/replay), and the STATIC WASM BUNDLE, where the
  // assets sit next to the page and there is no server at all. Stripping the
  // trailing "/client/<page>" recovers the prefix, so one expression serves all
  // three. The bundle is detected by its WASM adapter, not by a URL param.
  var COG_BASE = window.ProcgenStaticReplay
    ? '.'
    : location.pathname.replace(/\/clients?\/[^/]*$/, '') + '/client';
  var WIRE = C.WIRE, SPEEDS = C.SPEEDS, FPS = C.FPS;

  // Two independent tempo levers (§11, L20):
  //  (1) ANIM_MAX_FACTOR — chrome beat animations never play faster than this
  //      no matter the replay speed, so feed rows / flips / banners keep their
  //      read time at 8-16×. Applied as an animationFactor cap on durations.
  //  (2) DWELL_FLOOR_MS — a beat's on-screen hold has a wall-clock minimum
  //      (feed row / banner / curtain), collapsing only the dead time between
  //      contacts. These are NOT one speed knob — one caps motion, one floors dwell.
  var ANIM_MAX_FACTOR = 2;
  var DWELL_FLOOR_MS = { feed: 2600, banner: 1900, curtain: 2400, read: 600 };
  function animFactor() {
    // Lever 1 — the chrome plays at min(replaySpeed, cap): at 16× the board flies
    // but a kill row still slides in at 2×-equivalent so a human can read it.
    var sp = (lastState && lastState.sp) || 1;
    return Math.min(sp, ANIM_MAX_FACTOR);
  }
  function dwellFloor(kind) {
    // Lever 2 — a beat's on-screen hold has a wall-clock minimum regardless of
    // replay speed; speed collapses only the dead time between contacts, never
    // the read time of a beat itself. Independent of the animFactor cap.
    return DWELL_FLOOR_MS[kind] || DWELL_FLOOR_MS.read;
  }
  // Beat-pause (§11): freeze chrome ambient the instant a beat lands so idle
  // life never competes with a kill/steal/capture. Held for the READ_PAUSE floor
  // (≥600ms wall-clock), then released. The board's own 24Hz is never touched.
  var beatPulseTimer = null;
  function beatPulse() {
    stage.classList.add('beat-active');
    if (beatPulseTimer) clearTimeout(beatPulseTimer);
    beatPulseTimer = setTimeout(function () {
      stage.classList.remove('beat-active');
      beatPulseTimer = null;
    }, dwellFloor('read'));
  }
  var $ = C.$;
  var viewport = $('viewport');
  var stage = $('stage');
  var canvas = $('board');
  var statusEl = $('status');  // ---- pre-load curtain: the bot locker room -------------------------------
  // The stage opens on this scene (see #lockerroom CSS) while the socket /
  // wasm sim boots. The art frames are wired here (their base path is
  // delivery-mode dependent, like the cog art); the first ingested frame
  // calls dismissLockerRoom(), which fades the room out after a short
  // minimum dwell (a sub-second load would otherwise flash the scene like
  // a glitch).
  var lockerEl = $('lockerroom');
  var LOCKER_MIN_DWELL_MS = 900;
  var lockerShownAt = Date.now();
  var lockerCapTimer = null, lockerGone = false;
  (function buildLockerRoom() {
    // Scene art (nanobanana generations, like the shell's dungeon walls):
    // bg.jpg is the empty-room plate; each bot is five freestanding alpha
    // sprites (<bot>_<pose>.webp) cut from the generated pose frames. Same
    // three-delivery-modes path story as the cog art, so the base derives
    // from COG_BASE: native "<prefix>/client" + "/art/lockerroom", static
    // bundle "./art/lockerroom".
    var artBase = COG_BASE + '/art/lockerroom';
    $('lk-bg').src = artBase + '/bg.jpg';

    // Sprite geometry baked by the extraction script (scripts prompt in the
    // PR): ax/ay anchor each bot's bottom-center on the plate, w/h size each
    // pose — all in % of the 992x926 plate, so everything scales together.
    // Distinct cycle lengths keep the four carousels out of phase; the
    // composed scene state repeats only every few minutes.
    var LK_BOTS = {
      green:  { ax: 22.83, ay: 76.67, cyc: 4.6,
        poses: [{ f: 1, w: 14.82, h: 18.03 }, { f: 2, w: 14.92, h: 18.25 },
                { f: 3, w: 14.62, h: 18.14 }, { f: 5, w: 14.82, h: 18.25 },
                { f: 6, w: 14.62, h: 19.01 }] },
      blue:   { ax: 41.08, ay: 76.67, cyc: 3.8,
        poses: [{ f: 1, w: 16.63, h: 18.25 }, { f: 2, w: 14.92, h: 21.6 },
                { f: 3, w: 15.83, h: 21.81 }, { f: 5, w: 16.63, h: 20.63 },

    var spritesEl = $('lk-sprites');

    var bgImg = $('lk-bg');
    function fitLockerSprites() {
      spritesEl.style.left = bgImg.offsetLeft + 'px';
      spritesEl.style.top = bgImg.offsetTop + 'px';

    var lines = [
      'Generating levels…',
      'Drawing eight seeds…',
      'Polishing visors to a mirror shine…',
      'Memorising the published seeds…',
      'Squats. Even robots warm up…',
      'Counting the gems…',
      'Chalking up the wheels…',
      'Reading the map rows…'
    ];
    var capEl = $('lk-cap'), capIx = 0;
    lockerCapTimer = setInterval(function () {
      capEl.classList.add('swap');

    }, 2600);
  })();
  function dismissLockerRoom() {
    if (lockerGone) return;

    var wait = Math.max(0, LOCKER_MIN_DWELL_MS - (Date.now() - lockerShownAt));
    setTimeout(function () {
      lockerEl.classList.add('gone');
      setTimeout(function () {

        if (lockerCapTimer) { clearInterval(lockerCapTimer); lockerCapTimer = null; }
      }, 650);
    }, wait);
  }  // ---- embed mode (League Replayer) ----------------------------------------
  // When loaded inside the League Replayer shell (?embed=1), this client renders
  // ONLY the board (its own scorebug/transport/feed chrome is hidden by CSS via
  // body[data-embed]) and streams each parsed state frame up to the parent shell
  // over postMessage. The shell owns the walls + scorebug + KDA + standings and
  // draws them from this stream, so there is ONE websocket / ONE transport /
  // perfect tick-sync between the embedded game and the wall HUD.
  var EMBED = false;
  try { EMBED = new URLSearchParams(location.search).get('embed') === '1'; } catch (e) {}
  if (EMBED) document.body.setAttribute('data-embed', '1');

  // The starter's ?viewpanel=0 opt-out is GONE with the panel itself: this
  // arena is three small fixed rectangles that relayout() letterboxes whole at
  // every width, so there is no zoom bar and no minimap to hide.

  // Tick deep-link (?t=<tick>): seek there on load, paused, via the same s:
  // command the scrubber uses (the sim clamps out-of-range ticks). One-shot,
  // fired on the first ingested frame so the replay runtime is ready.
  var SEEK_T = null;
  try {
    var seekRaw = new URLSearchParams(location.search).get('t');
    if (seekRaw != null && /^\d+$/.test(seekRaw)) SEEK_T = parseInt(seekRaw, 10);
  } catch (e) {}

  // Achievement deep-link (?achievement=<id>): a badge's watch link. The lead
  // chrome frame carries the final game's earned badges with their focus cogs
  // (s.ach: [{id, s, n}]); when it arrives, select the receiving cog's POV via
  // the same v: command a squad-pip click sends. One-shot: once applied (or the
  // id turns out unearned in this recording) the param goes inert, so the
  // viewer is free to click elsewhere.
  var ACH_FOCUS = null;
  try {
    var achRaw = new URLSearchParams(location.search).get('achievement');
    if (achRaw) ACH_FOCUS = achRaw;
  } catch (e) {}
  function applyAchievementFocus(s) {
    if (ACH_FOCUS == null || !s.ach) return;
    var want = ACH_FOCUS;
    ACH_FOCUS = null;             // the lead frame ships once; so does this
    for (var i = 0; i < s.ach.length; i++) {
      if (s.ach[i].id === want && s.ach[i].s != null && s.ach[i].s >= 0) {
        send('v:' + s.ach[i].s);
        return;
      }
    }
  }
  function postToShell(type, payload) {
    if (!EMBED || window.parent === window) return;
    try { window.parent.postMessage({ src: 'procgen-replay', type: type, data: payload }, '*'); } catch (e) {}
  }
  var BOARD_W = 15, BOARD_H = 9;
  var BOARD_ASPECT = BOARD_W / BOARD_H;
  // BOARD_ASPECT is the CONSTANT 15/9 for every archetype, every variant and
  // every level, so relayout() never re-fits mid-replay and a tile is the same
  // size in every level (design note §Viewer -> Legible at 360 px).
  // syncBoardAspect stays as the starter wrote it and simply never fires.
  function syncBoardAspect(s) {
    if (!s || !(s.boardW > 1) || !(s.boardH > 1)) return;
    var aspect = s.boardW / s.boardH;
    if (Math.abs(aspect - BOARD_ASPECT) < 0.001) return;
    BOARD_W = s.boardW; BOARD_H = s.boardH; BOARD_ASPECT = aspect;
    relayout();
  }

  // ---- core (board renderer + frame packets) --------------------------------
  var lastState = null;
  // PROCGEN mode: latched on the first frame that carries a procgen field
  // (`gauntletLine` only rides procgen frames).
  var PROCGEN_MODE = false;
  var PB_CTX = null;             // filled at the end of this IIFE (hoisted)
  // A scrubber click that arrives before the first chrome frame is REMEMBERED,
  // not dropped: click-to-seek needs [startTick, maxTick] off the frame to map
  // the x-fraction onto a turn.
  var SEEK_FRAC = null;
  var replayAdapter = window.ProcgenStaticReplay || null;
  var coreConfig = {
    canvas: canvas,
    onText: function (txt) { onFrame(txt); },
    onStatus: function (st) { onStatus(st); },
    onFirstFrame: function () { core.setViewportFit(); },
    onTransform: function () { },
    websocket: !replayAdapter
  };
  var core = replayAdapter
    ? replayAdapter.createCore(coreConfig)
    : window.BroadcastCore.create(coreConfig);

  function send(cmd) { core.sendCommand(cmd); }

  function onStatus(st) {
    if (!statusEl) return;
    statusEl.textContent = st;
    statusEl.classList.toggle('show', st !== 'live');
  }

  var lastTurn = -1;
  function onFrame(txt) {
    var s;
    try { s = JSON.parse(txt); } catch (e) { return; }
    if (s.gauntletLine) PROCGEN_MODE = true;
    var jumped = Math.abs((s.t || 0) - lastTurn) > 1;
    lastTurn = s.t || 0;
    lastState = s;
    dismissLockerRoom();
    syncBoardAspect(s);
    renderClock(s);
    renderTransport(s);
    ingestLullSpans(s);
    ingestLeadSeries(s);
    renderMomentum();
    renderMismatch(s);
    if (SEEK_FRAC != null && s.en) { var f = SEEK_FRAC; SEEK_FRAC = null; seekToFraction(s, f); }
    if (PROCGEN_MODE && window.ProcgenChrome) window.ProcgenChrome.frame(s, PB_CTX, jumped);

  }

  function renderMismatch(s) {
    var el = $('mmwarn');
    if (!el) return;
    var bad = s.mismatch != null && s.mismatch >= 0;
    el.classList.toggle('on', bad);
    if (bad) {
      el.textContent = 'Replay hash mismatch at frame ' + s.mismatch +
        ' — showing recorded moves';
    }

  // ---------- kill feed queue (fixed reserve, dwell floor) ----------
  var feedEl = $('killfeed');
  var MAX_FEED = 4;
  function pushFeed(row) {
    feedEl.insertBefore(row, feedEl.firstChild);
    while (feedEl.children.length > MAX_FEED) feedEl.removeChild(feedEl.lastChild);
    // Dwell floor (lever 2): a wall-clock minimum so the row reads even at 16×.
    var hold = dwellFloor('feed');
    // animFactor cap (lever 1): the slide-in duration never dips below its
    // read-time, so the row still overshoots-and-settles legibly at high speed.
    row.style.animationDuration = (250 / animFactor()) + 'ms';
    setTimeout(function () {
      if (row.parentNode) { row.classList.add('leaving'); setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 300); }
    }, hold);
  }
  function clearFeed() { feedEl.innerHTML = ''; }

  // ---------- banner lane queue (one at a time, min hold) ----------
  var bannerEl = $('bannerlane');
  var bannerQueue = [];
  var bannerBusy = false;
  function banner(text, cls) {
    bannerQueue.push({ text: text, cls: cls });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    chip.textContent = b.text;
    bannerEl.appendChild(chip);
    // lever 1 (animFactor cap): the pop-in never plays faster than 2x, so a
    // fast-forward scrub can't reduce a banner to a subliminal flash.
    chip.style.animationDuration = (300 / animFactor()) + 'ms';
    var hold = dwellFloor('banner'); // lever 2: wall-clock dwell floor (~1.9s)
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 260);
    }, hold);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }  // ============================================================
  //  Transport wiring — DOM controls emit the legacy chat chars +
  //  the ctf-side s:/v: whole-string commands.
  // ============================================================
  function togglePlay() { send(' '); }
  // (speed chips + their speed→command map live in the shared chrome)
  $('btn-play').addEventListener('click', togglePlay);
  $('btn-restart').addEventListener('click', function () { send(','); });
  $('btn-back').addEventListener('click', function () { send('b'); });
  $('btn-fwd').addEventListener('click', function () { send('.'); });
  $('btn-end').addEventListener('click', function () { send('e'); });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  // click-to-seek: map x-fraction to a tick and send s:<tick>
  // Map an x-fraction of the scrubber onto the shown [startTick, maxTick] axis
  // and seek there. One place, shared by a live click and by a click that had
  // to wait for the first frame.
  function seekToFraction(s, frac) {
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    send('s:' + (st + Math.round(frac * (mx - st))));
  }

  $('scrub').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    // The axis lives on the frame, so a click before the first frame cannot be
    // mapped yet — QUEUE it (onFrame flushes SEEK_FRAC) rather than dropping
    // it. A dropped first click is invisible: the board is already drawn, the
    // transport looks alive, and the viewer just does not move.
    if (!lastState || !lastState.en) { SEEK_FRAC = frac; return; }
    seekToFraction(lastState, frac);
  });
  // keyboard shortcuts mirror the transport. The board zoom keys (z/x/0) and
  // the arrow pan are GONE with #viewpanel: all three boards fit the frame
  // whole, so there is nowhere to pan to.
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); togglePlay(); }
    else if (k === ',' || k === '<') send(',');
    else if (k === '.' || k === '>') send('.');
    else if (k === 'b') send('b');
    else if (k === 'e') send('e');
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === 'o') setSpoilers(!getSpoilers());
    else if (k >= '1' && k <= '9') send(k);
    // keydown never crosses the iframe boundary: relay Esc to the league
    // shell, which relays it on to the Observatory theater host.
    else if (k === 'Escape') postToShell('esc');
  });
  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region (game action) fits the board aspect into the box BETWEEN a
    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate to a FIXED POINT:
    // stop as soon as a pass measures the same bands it was laid out with. Two
    // passes settle a container resize, but a MAP-ASPECT change (the 1.874:1
    // arena → a square four-team board) swings --hudscale far enough that the
    // second pass is still reserving the old bands, which would leave the board
    // a couple of percent off its true aspect — visible as thin dead strips.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      // Measure each band's natural height → reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 && Math.abs(band - prevBand) < 0.5) break;
    }
    core.setViewportFit();
  }
  var ro = new ResizeObserver(relayout);
  ro.observe(viewport);
  window.addEventListener('resize', relayout);
  // The context the appended PROCGEN block reads the classic chrome
  // through. Declared here (hoisted `var`, so onFrame sees it however early
  // the first frame lands) rather than duplicating any of it: the game block
  // must not re-implement naming, escaping, feed insertion or the transport.
  PB_CTX = {
    $: $, C: C, esc: esc, fmt: fmt, send: send,
    pushFeed: pushFeed, banner: banner, clearFeed: clearFeed,
    seekToFraction: seekToFraction,
    getState: function () { return lastState; }
  };
  // Published for tools/ci/renderer_fixture.html. docker_smoke.sh runs with no
  // ANTHROPIC_API_KEY, so no replay CI can produce carries a single `say`: the
  // fixture is the only thing that ever drives the bubble, the beat markers,
  // the split bar, the plan trail, the feed's say row and the endcard --
  // and it must drive them through THIS page's own frame path (its feed queue,
  // its banner queue, its chrome_common instance) rather than a copy of it.
  window.PROCGEN_DRIVE_FRAME = onFrame;
  window.PROCGEN_PB_CTX = PB_CTX;
  if (window.ProcgenChrome) window.ProcgenChrome.install(PB_CTX);

  relayout();
  core.start();
})();
</script>

<!-- ============================================================
     PROCGEN additions to the inherited coworld-ctf chrome
     ============================================================
     Everything above this banner is the inherited broadcast page: the same
     CSS, the same markup ids, the same locker-room loader, the same embed
     mode, the same feed and banner queues, the same transport wiring and the
     same relayout() fixed-point band fit. Only the elements the design note
     lists as removed are gone (#viewpanel with its zoom bar and minimap —
     every level in every archetype is the same fixed 15x9 rectangle with no
     off-frame area, so relayout() letterboxes it whole at every width; #fpv
     and its children; #povBadge; the ctf scorebug internals; #plates-r and
     the second plate column, because there is ONE seat; the six
     never-emitted beat-marker kinds; and the perk/handicap badges), and only
     the enumerated label strings are re-mapped.

     Nothing here touches the transport band. relayout() still owns
     --hudscale, --topband and --band on :root; the endcard still stops at
     bottom: var(--band, 0px) and is still dismissed by every seek; and every
     scrubber beat this block draws is a LABELLED, CLICKABLE BUTTON that seeks
     on click, styled for EVERY kind the sim emits and no others — levelstart,
     collect, exitopen, death, levelend, fallback and gauntletend. The builder
     is named procgenBeat precisely so it can never be shadowed by the chrome
     alias block's `var markBeat = C.markBeat` (the tandem 2026-08-23 hoisting
     trap).
     ============================================================ -->
<style>

#endcard .ec-thead, #endcard .ec-row {
  display: grid;
  grid-template-columns: 0.5fr 0.9fr 1.1fr 0.8fr 0.9fr 0.6fr 0.7fr;
  gap: calc(6 * var(--u));
  font-family: var(--finefont);
  font-size: calc(10 * var(--u));
  align-items: center;
}
#endcard .ec-thead { color: var(--paper-dim); text-transform: uppercase; letter-spacing: 0.12em; }
#endcard .ec-row.unseen { color: var(--amber); }
#endcard .ec-table { width: calc(460 * var(--u)); max-width: 100%; display: flex; flex-direction: column; gap: calc(3 * var(--u)); }
#endcard .how { max-width: calc(460 * var(--u)); white-space: nowrap; }

/* ---- 360 px: the featured-match iframe is the real target ---- */
@media (max-width: 640px) {
  .plate .cog-alias, .plate .gem-label, .plate .lvl-label { display: none; }
}
#stage.tiny .plate .cog-alias,
#stage.tiny .plate .gem-label,
#stage.tiny .plate .lvl-label { display: none; }
/* Under .tiny the SEEN/UNSEEN chip becomes a 3px underline on the level chip
   and the fallback glyph moves inline, so the plate keeps only alias + name +
   level chip + gems. */
#stage.tiny .plate .split-chip {
  width: 100%;
  height: calc(3 * var(--u));
  padding: 0;
  font-size: 0;
  position: absolute;
  left: 0;
  bottom: calc(-4 * var(--u));
}
#stage.tiny .plate .lvl-chip { position: relative; }
#stage.tiny #momentum { height: 50%; }
#stage.tiny #killfeed .feed-row:nth-child(n+4) { display: none; }
</style>
<script>
(function () {
  'use strict';

  var CTX = null;
  var placedBeats = {};
  var seenFeed = {};
  var announcedLevel = 0;

  function ensureTable() {
    var host = CTX.$('ec-teams');
    if (!host) return null;
    var table = host.querySelector('.ec-table');
    if (!table) {
      host.innerHTML = '';
      table = document.createElement('div');
      table.className = 'ec-table';
      // The re-mapped endcard header. A forked ctf endcard otherwise ships
      // paintbot's vocabulary; tests/test_procgen_endcard_labels.nim greps
      // the built page for it and fails the build if it comes back.
      // The headline pair keeps the starter's ec-lives shape with the two
      // enumerated re-labels of the starter's two headline captions
      // (design note §Endcard and chrome label re-mapping).
      table.innerHTML = '<div class="ec-lives">' +
        '<span class="fl-num" id="ec-unseen">0</span>' +
        '<span class="fl-cap">Unseen mean</span>' +
        '<span class="fl-num" id="ec-seen">0</span>' +
        '<span class="fl-cap">Seen mean</span>' +
        '</div>' +
        '<div class="ec-thead"><span>Level</span><span>Kind</span>' +
        '<span>Seed</span><span>Split</span><span>Outcome</span>' +
        '<span>Gems</span><span>Return</span></div>';
      host.appendChild(table);
    }
    return table;
  }

  // The scrubber beat builder. NAMED procgenBeat, never markBeat: the alias
  // block above hoists `var markBeat = C.markBeat`, and a game-block function
  // of the same name would shadow it and render unlabelled div markers that
  // never seek (the tandem 2026-08-23 trap).
  function procgenBeat(s, frame, kind, tone, label) {
    var key = frame + '|' + kind;
    if (placedBeats[key]) return;
    placedBeats[key] = true;
    var scrub = CTX.$('scrub');
    if (!scrub) return;
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    var frac = Math.min(1, Math.max(0, (frame - st) / (mx - st)));
    var el = document.createElement('button');
    el.className = 'beat-marker ' + kind + (tone ? ' ' + tone : '');
    el.style.left = (frac * 100) + '%';
    el.title = label;
    el.setAttribute('aria-label', label);
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var now = CTX.getState();
      if (now) CTX.seekToFraction(now, frac);
    });
    scrub.appendChild(el);
  }

  function plateHtml(p) {
    var split = (p.split || '').toLowerCase();
    return '<span class="cog-chip"></span>' +
      '<span class="plate-name">' + CTX.esc(p.name || '') + '</span>' +
      '<span class="cog-alias">' + CTX.esc(p.alias || '') + '</span>' +
      '<span class="lvl-chip">L' + (p.level || 0) + '/' + (p.of || 0) +
        ' · ' + CTX.esc(String(p.kind || '').toUpperCase()) +
        (split ? '<span class="split-chip ' + split + '">' + split +
          '</span>' : '') +
      '</span>' +
      '<span class="lvl-label">Level</span>' +
      '<span class="gem-num">' + (p.collected || 0) + '/' + (p.total || 0) +
        '</span>' +
      '<span class="gem-label">Gems</span>' +
      (p.fallback ? '<span class="fbk" title="this seat has taken a fallback">&#8623;</span>' : '');
  }

  var plateBuilt = false;
  function renderPlate(s) {
    var left = CTX.$('plates-l');
    if (!left || !s.roster || !s.roster.length) return;
    if (!plateBuilt) {
      left.innerHTML = '';
      var el = document.createElement('div');
      el.className = 'plate side-l';
      el.id = 'plate-0';
      left.appendChild(el);
      plateBuilt = true;
    }
    var host = CTX.$('plate-0');
    if (!host) return;
    var p = s.roster[0];
    // The plate carries the seat's REAL policy name (spectator side only)
    // beside its in-game alias. `kind` rides for the archetype chip.
    p.kind = s.kind || p.kind;
    host.classList.toggle('dead', p.alive === false);
    var html = plateHtml(p);
    if (host.__html !== html) { host.innerHTML = html; host.__html = html; }
  }

  function renderClockLine(s) {
    // The big central numeral is LEVEL n/8; the time slot carries the turn and
    // the frame, and the caption the archetype, the board, the difficulty and
    // the SPLIT with its seed -- spectator side only; the seat is never told
    // any of it.
    var t = CTX.$('clock-time'), cap = CTX.$('clock-caption');
    if (t) {
      t.textContent = 'turn ' + (s.turn || 0) + '/' + (s.turns || 0) +
        ' · frame ' + (s.frame || 0);
    }
    if (cap) {
      cap.textContent = s.ph === 'lobby'
        ? 'Before the first level'
        : (String(s.kind || '') + ' · 15×9 · ' + (s.difficulty || '') +
           ' · ' + String(s.split || '').toUpperCase() + ' seed ' +
           (s.seed || 0));
    }
    var clock = CTX.$('clock');
    if (clock) {
      var badge = clock.querySelector('.level-badge');
      if (!badge) {
        badge = document.createElement('div');
        badge.className = 'level-badge time';
        clock.insertBefore(badge, clock.firstChild);
      }
      badge.textContent = 'LEVEL ' + (s.level || 0) + '/' + (s.levels || 0);
    }
  }

  function renderFeed(s) {
    if (!s.feed) return;
    for (var i = 0; i < s.feed.length; i++) {
      var f = s.feed[i];
      var key = s.t + '|' + i + '|' + f.row;
      if (seenFeed[key]) continue;
      seenFeed[key] = true;
      var row = document.createElement('div');
      row.className = 'feed-row';
      row.innerHTML = '<span class="who">' + CTX.esc(f.row) + '</span>';
      CTX.pushFeed(row);
    }
  }

  function milli(v) {
    return (Math.round(v || 0) / 1000).toFixed(3);
  }

  function renderEndcard(s) {
    var card = CTX.$('endcard');
    if (!card) return;
    if (!s.over || !s.results) { card.classList.remove('on'); return; }
    var r = s.results;
    var table = ensureTable();
    if (table && !table.__filled) {
      table.__filled = true;
      for (var i = 0; i < (r.levelKinds || []).length; i++) {
        var row = document.createElement('div');
        row.className = 'ec-row' +
          (r.levelSplit[i] === 'unseen' ? ' unseen' : '');
        row.innerHTML =
          '<span>' + (i + 1) + '</span>' +
          '<span>' + CTX.esc(r.levelKinds[i]) + '</span>' +
          '<span>' + r.levelSeeds[i] + '</span>' +
          '<span>' + CTX.esc(r.levelSplit[i]) + '</span>' +
          '<span>' + CTX.esc(r.levelOutcome[i]) + '</span>' +
          '<span>' + r.levelCollected[i] + '/' + r.levelCollectTotal[i] +
            '</span>' +
          '<span>' + r.levelReturns[i] + '</span>';
        table.appendChild(row);
      }
    }
    CTX.C.setName('ec-unseen', milli(r.unseenMilli));
    CTX.C.setName('ec-seen', milli(r.seenMilli));
    CTX.C.setName('ec-headline', 'SCORE ' + milli(r.unseenMilli) +
      ' — mean over ' + (r.levelCount / 2) + ' unseen levels');
    CTX.C.setName('ec-wincond', 'seen ' + milli(r.seenMilli) + ' · unseen ' +
      milli(r.unseenMilli) + ' · gap ' +
      (r.gapMilli >= 0 ? '+' : '') + milli(r.gapMilli));
    CTX.C.setName('ec-how', (r.variant || '') + ' · ' + (r.difficulty || '') +
      ' · ' + (r.levelCount / 2) + ' seen / ' + (r.levelCount / 2) +
      ' unseen · ' + (r.unseenCleared || 0) + ' of ' + (r.levelCount / 2) +
      ' unseen levels cleared');
    card.classList.add('on');
  }

  function procgenFrame(s, ctx, jumped) {
    CTX = ctx;
    if (jumped) seenFeed = {};
    renderPlate(s);
    renderClockLine(s);
    renderFeed(s);
    renderEndcard(s);
    // The up-front beat timeline (shipped ONCE by the pre-scan) places every
    // marker before playback reaches it, as labelled buttons.
    if (s.beats) {
      for (var i = 0; i < s.beats.length; i++) {
        var b = s.beats[i];
        procgenBeat(s, b.t, b.k, '', b.label);
      }
    }
    // The level transition banner lives in the TOP band, never the transport
    // band.
    if (s.level && s.level !== announcedLevel && s.ph !== 'lobby') {
      announcedLevel = s.level;
      CTX.banner('LEVEL ' + s.level + ' of ' + (s.levels || 0) + ' — ' +
        String(s.kind || '').toUpperCase() + ' — ' +
        String(s.split || '').toUpperCase(), 'level');
    }
  }

  function procgenEvent() { return false; }

  window.ProcgenChrome = {
    install: function (ctx) { CTX = ctx; },
    frame: procgenFrame,
    event: procgenEvent
  };
})();
</script>

</body>
</html>
